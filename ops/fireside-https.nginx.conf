# Standalone Fireside TLS edge. This is a complete nginx main configuration.
# It intentionally does not include /etc/nginx/nginx.conf, conf.d, or sites-enabled.

worker_processes auto;
error_log stderr notice;
pid /run/fireside-https/nginx.pid;

events {
  worker_connections 1024;
}

http {
  log_format fireside '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
  # The hardened systemd unit has a private /dev. Keep request metadata out of
  # the edge journal; application failures still reach stderr via error_log.
  access_log off;
  server_tokens off;

  # Stream request/response bodies so the application remains the authority for
  # its structured 1 MiB API error contract instead of nginx returning HTML 413.
  client_max_body_size 0;
  client_body_timeout 15s;
  client_header_timeout 15s;
  send_timeout 30s;

  server {
    listen 0.0.0.0:443 ssl http2;
    listen [::]:443 ssl http2;
    server_name firesidechat.cn www.firesidechat.cn;

    ssl_certificate /run/credentials/fireside-https.service/fullchain.pem;
    ssl_certificate_key /run/credentials/fireside-https.service/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers off;
    ssl_ecdh_curve X25519:secp256r1;
    ssl_session_cache shared:FiresideTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    if ($host = www.firesidechat.cn) {
      return 308 https://firesidechat.cn$request_uri;
    }

    if ($host != firesidechat.cn) {
      return 421;
    }

    location / {
      proxy_pass http://127.0.0.1:80;
      proxy_http_version 1.1;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_connect_timeout 3s;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
    }
  }
}
